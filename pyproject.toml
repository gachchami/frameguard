[project]
name = "frameguard"
version = "0.2.0"
description = "Multimodal secret detection and video redaction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gradio>=5.0,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
