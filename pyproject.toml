[project]
name = "frameguard"
version = "0.2.0"
description = "Multimodal secret detection and video redaction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mlx-lm-omni>=0.1.3",
  "numpy>=1.26,<2.3",
  "numba>=0.61.2,<1; sys_platform == 'darwin'",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "qwen-omni-utils>=0.0.8; sys_platform == 'darwin'",
  "soundfile>=0.13,<1; sys_platform == 'darwin'",
  "torch>=2.7,<3; sys_platform == 'darwin'",
  "torchvision>=0.22,<1; sys_platform == 'darwin'",
  "transformers==4.52.3; sys_platform == 'darwin'",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
